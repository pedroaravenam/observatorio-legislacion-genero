databaseChangeLog:
  - changeSet:
      id: 0008-revision-revisor
      author: observatorio
      comment: Quien reviso cada proyecto (Claude o Codex) y con que modelo, para poder comparar a los dos agentes.
      changes:
        - addColumn:
            tableName: revision_v5
            columns:
              - column: { name: revisor, type: VARCHAR(20), remarks: "claude o codex" }
              - column: { name: modelo, type: VARCHAR(60) }
  - changeSet:
      id: 0008-revision-reclamos
      author: observatorio
      comment: >
        Reparto del trabajo entre varios agentes en paralelo: cada uno reclama una tanda de proyectos y nadie mas la toma
        mientras el reclamo no expire.
      changes:
        - createTable:
            tableName: revision_v5_reclamo
            columns:
              - column: { name: boletin, type: VARCHAR(20), constraints: { primaryKey: true, primaryKeyName: pk_revision_reclamo, nullable: false } }
              - column: { name: revisor, type: VARCHAR(20), constraints: { nullable: false } }
              - column: { name: reclamado, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
