databaseChangeLog:
  - changeSet:
      id: 0001-ingesta-ejecucion
      author: observatorio
      comment: Registro de cada ejecución de ingesta y su resultado.
      changes:
        - createTable:
            tableName: ingesta_ejecucion
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_ingesta_ejecucion } }
              - column: { name: proceso, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: parametros, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: inicio, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: termino, type: TIMESTAMP WITH TIME ZONE }
              - column: { name: estado, type: SMALLINT, constraints: { nullable: false } }
              - column: { name: respuestas_nuevas, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: respuestas_repetidas, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: registros_insertados, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: registros_actualizados, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: registros_sin_cambio, type: INT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: detalle, type: VARCHAR(4000) }

  - changeSet:
      id: 0001-respuesta-cruda
      author: observatorio
      comment: >
        Capa de aterrizaje inmutable. Una respuesta idéntica a una ya guardada
        (misma fuente, operación, parámetros y hash) no se vuelve a guardar.
      changes:
        - createTable:
            tableName: respuesta_cruda
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_respuesta_cruda } }
              - column: { name: fuente, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: operacion, type: VARCHAR(100), constraints: { nullable: false } }
              - column: { name: parametros, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: url, type: VARCHAR(500), constraints: { nullable: false } }
              - column: { name: fecha_consulta, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: estado_http, type: INT, constraints: { nullable: false } }
              - column: { name: hash, type: CHAR(64), constraints: { nullable: false } }
              - column: { name: contenido, type: CLOB, constraints: { nullable: false } }
              - column:
                  name: ejecucion_id
                  type: BIGINT
                  constraints: { nullable: false, foreignKeyName: fk_respuesta_cruda_ejecucion, references: ingesta_ejecucion(id) }
        - addUniqueConstraint:
            tableName: respuesta_cruda
            columnNames: fuente, operacion, parametros, hash
            constraintName: uq_respuesta_cruda
