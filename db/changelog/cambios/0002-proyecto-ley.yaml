databaseChangeLog:
  - changeSet:
      id: 0002-catalogos
      author: observatorio
      comment: Catálogos con el código que entrega la fuente.
      changes:
        - createTable:
            tableName: tipo_iniciativa
            columns:
              - column: { name: id, type: INT, constraints: { primaryKey: true, primaryKeyName: pk_tipo_iniciativa } }
              - column: { name: nombre, type: VARCHAR(100), constraints: { nullable: false } }
        - createTable:
            tableName: camara
            columns:
              - column: { name: id, type: INT, constraints: { primaryKey: true, primaryKeyName: pk_camara } }
              - column: { name: nombre, type: VARCHAR(100), constraints: { nullable: false } }

  - changeSet:
      id: 0002-proyecto-ley
      author: observatorio
      comment: Proyecto de ley canónico, con procedencia por registro.
      changes:
        - createTable:
            tableName: proyecto_ley
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_proyecto_ley } }
              - column: { name: boletin, type: VARCHAR(20), constraints: { nullable: false, unique: true, uniqueConstraintName: uq_proyecto_ley_boletin } }
              - column: { name: titulo, type: VARCHAR(4000), constraints: { nullable: false } }
              - column: { name: fecha_ingreso, type: DATE, constraints: { nullable: false } }
              - column:
                  name: tipo_iniciativa_id
                  type: INT
                  constraints: { nullable: false, foreignKeyName: fk_proyecto_ley_tipo, references: tipo_iniciativa(id) }
              - column:
                  name: camara_origen_id
                  type: INT
                  constraints: { nullable: false, foreignKeyName: fk_proyecto_ley_camara, references: camara(id) }
              - column: { name: admisible, type: BOOLEAN }
              - column: { name: fuente, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: id_origen, type: VARCHAR(50), constraints: { nullable: false } }
              - column:
                  name: respuesta_cruda_id
                  type: BIGINT
                  constraints: { nullable: false, foreignKeyName: fk_proyecto_ley_respuesta, references: respuesta_cruda(id) }
              - column: { name: fecha_consulta, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: hash_contenido, type: CHAR(64), constraints: { nullable: false } }
              - column: { name: creado, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: actualizado, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: proyecto_ley
            columnNames: fuente, id_origen
            constraintName: uq_proyecto_ley_origen
        - createIndex:
            tableName: proyecto_ley
            indexName: ix_proyecto_ley_fecha
            columns:
              - column: { name: fecha_ingreso }
