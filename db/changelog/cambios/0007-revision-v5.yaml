databaseChangeLog:
  - changeSet:
      id: 0007-revision-v5
      author: observatorio
      comment: >
        Segunda opinion del agente sobre los proyectos que incluyo la lista v5. No altera la seleccion publicada:
        permite comparar y decidir despues que decisiones se aplican.
      changes:
        - createTable:
            tableName: revision_v5
            columns:
              - column: { name: boletin, type: VARCHAR(20), constraints: { primaryKey: true, primaryKeyName: pk_revision_v5, nullable: false } }
              - column: { name: version, type: VARCHAR(20), constraints: { nullable: false }, remarks: "version del criterio del agente" }
              - column: { name: incluye, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: grupo, type: VARCHAR(20) }
              - column: { name: confianza, type: VARCHAR(10) }
              - column: { name: motivo, type: VARCHAR(600) }
              - column: { name: sin_texto, type: VARCHAR(120), remarks: "motivo por el que no se pudo leer el documento, si aplica" }
              - column: { name: apariciones, type: INT }
              - column: { name: densidad, type: "NUMERIC(7,1)" }
              - column: { name: revisado, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
